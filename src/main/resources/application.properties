# Runtime configuration. Credentials and keys are supplied externally.
spring.application.name=irr-backend
server.port=${SERVER_PORT:9191}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:irr}
spring.datasource.username=${DB_USER:irr_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
rsa.public-key=${RSA_PUBLIC_KEY:file:./.local/keys/public.pem}
rsa.private-key=${RSA_PRIVATE_KEY:file:./.local/keys/private.pem}
spring.jpa.hibernate.ddl-auto=validate
# Responses are mapped inside transactional services.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
irr.storage.directory=${STORAGE_DIRECTORY:./.local/uploads}

# Official API documentation for the pre-production environment.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Development bootstrap is inactive outside the development profile.
irr.development.bootstrap-enabled=${DEV_BOOTSTRAP_ENABLED:false}
irr.development.admin-name=${DEV_ADMIN_NAME:Development Administrator}
irr.development.admin-email=${DEV_ADMIN_EMAIL:}
irr.development.admin-password=${DEV_ADMIN_PASSWORD:}

# Explicit browser allowlist; bearer tokens do not require credentialed cookies.
irr.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Redis is internal infrastructure; authorization and inventory remain in PostgreSQL.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Development-only initial organization; existing membership decisions survive restarts.
irr.development.organization-id=${DEV_ORGANIZATION_ID:11111111-1111-4111-8111-111111111111}
irr.development.organization-name=${DEV_ORGANIZATION_NAME:IRR Development}
spring.data.web.pageable.max-page-size=200
