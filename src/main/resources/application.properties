# ===================================================================
# Database ( docker ) configuration
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:irr}
spring.datasource.host=localhost

spring.datasource.username=${DB_USER:irr_admin}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# spring security -> disable basic login screen
spring.security.user.name=admin
spring.security.user.password=admin

# JWT Configuration
rsa.publickey=classpath:public.key
rsa.privatekey=classpath:private.key

# debug + endpoint that shows all mapped endpoints for troubleshooting
# logging.level.root=DEBUG
logging.level.org.code.api.filter.BearerFilter=DEBUG
logging.level.org.code.api.controllers.DriverController=DEBUG
logging.level.org.code.api.controllers.ErrorHandler=DEBUG

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
management.endpoints.web.exposure.include=mappings

# ===================================================================
# JPA / Hibernate configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=9191

# ===================================================================
# JPA / Hibernate configuration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true
