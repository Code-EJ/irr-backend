name: Backend verification

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  
  verify:
    name: Java Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Maven verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      
      - name: Publish build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: irr-backend-jar
          path: target/*.jar
          if-no-files-found: error
      
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn
  
  security:
    name: Dependency Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Resolve Maven dependency tree
        run: |
          mkdir -p .local/audit
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            dependency:tree \
            -DoutputType=json \
            -DoutputFile=.local/audit/dependency-tree.json
      
      - name: Audit resolved Maven dependencies
        run: node scripts/audit-dependencies.mjs
      
      - name: Publish dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            .local/audit/dependency-tree.json
            .local/audit/osv-audit.json
          include-hidden-files: true
          if-no-files-found: warn
  
  documentation:
    name: Documentation Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Validate documentation
        run: node scripts/verify-documentation.mjs
  
  container:
    name: Container Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build production image
        run: docker build -t irr-backend:ci .
      
      - name: Inspect image
        run: docker image inspect irr-backend:ci