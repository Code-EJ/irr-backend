name: 📖 User Story
description: Nova User Story
labels: ["user-story"]
body:
  - type: input
    id: id
    attributes:
      label: ID
      placeholder: ex. US-001
    validations:
      required: true

  - type: input
    id: criado-por
    attributes:
      label: Criado por
      placeholder: ex. Jhonathan Pimenta
    validations:
      required: true

  - type: input
    id: story-points
    attributes:
      label: Story Points
      placeholder: ex. 3
    validations:
      required: true

  - type: textarea
    id: historia
    attributes:
      label: História
      placeholder: |
        Como [quem],
        Quero [o quê],
        Para que [por quê].
    validations:
      required: true

  - type: textarea
    id: criterios-aceite
    attributes:
      label: Critérios de Aceite
      placeholder: |
        - Dado [contexto], Quando [ação], Então [resultado].
    validations:
      required: true

  - type: textarea
    id: dependencias
    attributes:
      label: Dependências
      placeholder: |
        - Técnicas: ...
        - Externas: ...

  - type: textarea
    id: recursos
    attributes:
      label: Recursos e Referências
      placeholder: |
        - [Nome do documento ou link](url)

  - type: textarea
    id: observacoes
    attributes:
      label: Observações Técnicas
      description: Preenchido pelo Tech Lead ou Dev Team quando necessário.
