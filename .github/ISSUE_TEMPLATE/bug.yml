name: Bug
description: Report incorrect application behavior
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: Include sanitized evidence without credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the application version and environment.
    validations:
      required: true
