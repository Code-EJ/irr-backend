name: ✅ Task
description: Nova Task
labels: ["task"]
title: "[TASK]: "
body:
  - type: input
    id: user-story
    attributes:
      label: User Story relacionada
      placeholder: ex. #42
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que precisa ser feito?
      placeholder: ex. Implementar endpoint POST /auth/sso
    validations:
      required: true

  - type: textarea
    id: observacoes
    attributes:
      label: Observações Técnicas
      description: Contexto, restrições ou referências relevantes. Deixe em branco se não houver.

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: Código commitado na branch correta, seguindo a convenção de nomenclatura
        - label: Commit message segue o padrão (Conventional Commits)
        - label: Code review feito por ao menos 1 desenvolvedor ou Tech Lead
        - label: Build passando, sem erros de compilação
        - label: Card atualizado com comentário resumindo o que foi feito
